# ==============================================================================
# BLFA Learning Lab - Nginx Reverse Proxy Configuration
# ==============================================================================
# Reverse proxy serving static WordPress assets and proxying dynamic PHP
# requests to the upstream WordPress PHP-FPM container.
# ==============================================================================

server {
    listen 80;
    server_name localhost local.blfa.com;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 64M;

    # --------------------------------------------------------------------------
    # Health check endpoint for container orchestrators and curl testing
    # --------------------------------------------------------------------------
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # --------------------------------------------------------------------------
    # Security: Deny access to hidden files (.git, .env, .htaccess)
    # --------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # Security: Prevent executing arbitrary uploaded PHP scripts
    # --------------------------------------------------------------------------
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }

    # --------------------------------------------------------------------------
    # WordPress Front Controller Pattern (Pretty Permalinks & GraphQL)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # --------------------------------------------------------------------------
    # Pass PHP scripts to WordPress PHP-FPM container over port 9000
    # --------------------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # --------------------------------------------------------------------------
    # Direct static file serving and client-side caching
    # --------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
        access_log off;
    }
}
