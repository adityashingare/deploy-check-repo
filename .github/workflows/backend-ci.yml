name: Backend CI Pipeline

on:
  push:
    branches:
      - backend
  pull_request:
    branches:
      - backend

# Minimal permissions required for CI
permissions:
  contents: read

jobs:
  validate-compose-and-nginx:
    name: Validate Docker Compose & Nginx
    runs-on: ubuntu-latest

    steps:
      - name: Check out backend repository
        uses: actions/checkout@v4

      - name: Prepare environment configuration
        run: |
          cp .env.example .env

      - name: Validate Docker Compose Configuration Syntax
        run: |
          docker compose config --quiet

      - name: Validate Nginx Virtual Host Configuration Syntax
        run: |
          docker run --rm \
            --add-host wordpress:127.0.0.1 \
            -v ${{ github.workspace }}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:1.27-alpine nginx -t

      - name: Start backend Compose services
        run: |
          docker compose up -d

      - name: Verify Live Nginx Configuration & Health Check
        run: |
          sleep 5
          docker compose exec nginx nginx -t
          curl --fail --retry 5 --retry-delay 3 http://localhost:9000/healthz

      - name: Clean up Compose stack
        if: always()
        run: |
          docker compose down -v
