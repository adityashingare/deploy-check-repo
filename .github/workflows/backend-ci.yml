name: Backend CI Pipeline

on:
  push:
    branches:
      - backend
  pull_request:
    branches:
      - backend

# Minimal permissions required for CI
permissions:
  contents: read

jobs:
  validate-compose-and-nginx:
    name: Validate Docker Compose & Nginx
    runs-on: ubuntu-latest

    steps:
      - name: Check out backend repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration Syntax
        run: |
          docker compose config --quiet

      - name: Validate Nginx Virtual Host Configuration
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:1.27-alpine nginx -t

      - name: Pull and verify official container images
        run: |
          docker pull mysql:8.0
          docker pull wordpress:php8.2-fpm-alpine
          docker pull nginx:1.27-alpine
          docker pull wordpress:cli-php8.2
