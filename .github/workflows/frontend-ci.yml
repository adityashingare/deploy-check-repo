name: Frontend CI Pipeline

on:
  push:
    branches:
      - frontend
  pull_request:
    branches:
      - frontend

# Minimal permissions required for CI
permissions:
  contents: read

jobs:
  validate-and-build:
    name: Lint, Test, and Build Next.js
    runs-on: ubuntu-latest

    steps:
      - name: Check out frontend repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js application
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          NEXT_PUBLIC_WORDPRESS_API_URL: http://localhost:9000/graphql
          WORDPRESS_INTERNAL_API_URL: http://nginx/graphql
        run: npm run build

  docker-image-validation:
    name: Build & Validate Frontend Docker Image
    runs-on: ubuntu-latest
    needs: validate-and-build

    steps:
      - name: Check out frontend repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and validate Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: blfa-frontend:ci-test
          build-args: |
            NEXT_PUBLIC_WORDPRESS_API_URL=http://localhost:9000/graphql
            WORDPRESS_INTERNAL_API_URL=http://nginx/graphql
