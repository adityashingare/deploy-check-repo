# ==============================================================================
# BLFA Learning Lab - Frontend Docker Compose Configuration
# ==============================================================================
# Orchestrates the Next.js frontend container.
# Connects to the shared external Docker network 'blfa-network' created by
# the backend Compose project or via `docker network create blfa-network`.
# ==============================================================================

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Client-side GraphQL endpoint embedded into browser JavaScript bundle
        NEXT_PUBLIC_WORDPRESS_API_URL: ${NEXT_PUBLIC_WORDPRESS_API_URL:-http://localhost:9000/graphql}
        # Internal container-to-container URL used by SSR during build
        WORDPRESS_INTERNAL_API_URL: ${WORDPRESS_INTERNAL_API_URL:-http://nginx/graphql}
    container_name: blfa-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Internal URL for Next.js Server Components / SSR fetch (direct Docker network to Nginx)
      - WORDPRESS_INTERNAL_API_URL=${WORDPRESS_INTERNAL_API_URL:-http://nginx/graphql}
      # Browser-facing public URL for client-side queries
      - NEXT_PUBLIC_WORDPRESS_API_URL=${NEXT_PUBLIC_WORDPRESS_API_URL:-http://localhost:9000/graphql}
    networks:
      - blfa-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  blfa-network:
    name: blfa-network
    external: true
