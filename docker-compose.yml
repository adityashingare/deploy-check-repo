# ==============================================================================
# BLFA Learning Lab - Backend Docker Compose Configuration
# ==============================================================================
# Orchestrates official, unmodified images for Headless WordPress, Nginx, and MySQL 8.
# Strictly conforms to the requirement of ZERO custom backend Dockerfiles.
# ==============================================================================

version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. MySQL 8.0 Relational Database
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: blfa-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-blfa_local}
      MYSQL_USER: ${WORDPRESS_DB_USER:-blfa_local}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-blfa_local_pass}
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-root_local_pass}
    volumes:
      # Named persistent volume preserving database state across container lifecycles
      - db_data:/var/lib/mysql
    networks:
      - blfa-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${WORDPRESS_DB_ROOT_PASSWORD:-root_local_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ----------------------------------------------------------------------------
  # 2. WordPress Headless CMS (Official PHP-FPM Image - No Custom Dockerfile)
  # ----------------------------------------------------------------------------
  wordpress:
    image: wordpress:php8.2-fpm-alpine
    container_name: blfa-wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-blfa_local}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-blfa_local}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-blfa_local_pass}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-1}
    volumes:
      # Shared volume containing WordPress core files, plugins (WPGraphQL), and uploads
      - wp_data:/var/www/html
    networks:
      - blfa-network

  # ----------------------------------------------------------------------------
  # 3. Nginx Reverse Proxy (Official Image)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: blfa-nginx
    restart: unless-stopped
    ports:
      # Host Port 9000 -> Container Port 80
      - "${WORDPRESS_PORT:-9000}:80"
    volumes:
      # Mount Nginx virtual host configuration
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Read-only mount of shared WordPress files to serve static assets directly
      - wp_data:/var/www/html:ro
    depends_on:
      - wordpress
    networks:
      - blfa-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 4. WP-CLI Helper (Official Image - Utility Tool Profile)
  # ----------------------------------------------------------------------------
  # Run on-demand using: docker compose run --rm wp-cli <command>
  # Avoids building any custom WordPress images or installing packages on host.
  wp-cli:
    image: wordpress:cli-php8.2
    container_name: blfa-wp-cli
    user: "33:33" # Run as www-data user to preserve correct file permissions
    volumes:
      - wp_data:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-blfa_local}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-blfa_local}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-blfa_local_pass}
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    networks:
      - blfa-network
    profiles:
      - tools

# ------------------------------------------------------------------------------
# Persistent Named Volumes
# ------------------------------------------------------------------------------
volumes:
  db_data:
    name: blfa_db_data
  wp_data:
    name: blfa_wp_data

# ------------------------------------------------------------------------------
# Shared Docker Bridge Network
# ------------------------------------------------------------------------------
networks:
  blfa-network:
    name: blfa-network
    driver: bridge
